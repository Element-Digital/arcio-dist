variant: flatcar
version: 1.1.0

# Arcio OS — the whole appliance, as one Ignition config.
#
# Transpile with `butane --strict butane.yaml -o config.ign`, then either bake
# the result into the OEM partition of a stock Flatcar image (the appliance) or
# hand it to the hypervisor at first boot (development). See build.sh.
#
# ── What this is and is not ─────────────────────────────────────────────────
#
# It is a stock Flatcar LTS turned into an Arcio appliance by configuration
# only. There is no custom OS image, no package manager, and nothing compiled
# here. Everything below is a file or a unit.
#
# ── Configuration here, payload in the image ────────────────────────────────
#
# Nothing large goes in this file. Ignition is delivered through fw_cfg or the
# OEM partition and neither is a bulk transport: a 14 MB compose sysext inlined
# as base64 produced a 14.7 MB config and hung ignition-fetch-offline
# indefinitely, with no timeout and no progress. Measured, not guessed.
#
# So the split is: this file carries files, units and users. The image build
# (M2) carries anything measured in megabytes.
#
# ── Facts this is written against ───────────────────────────────────────────
#
# Established by booting Flatcar LTS 4081.3.10 on 2026-09-14, not assumed:
#
#   * Flatcar ships Docker 26.1.0 and docker-buildx. It does **not** ship
#     `docker compose`. Docker itself arrives as a systemd-sysext, so compose
#     does too — see the docker-compose extension below.
#   * /opt is writable as root and is a valid sysext hierarchy.
#   * /usr is read-only, so arcioctl cannot go in /usr/local/bin the way the
#     Docker install guide puts it. /opt/bin, and the unit calls it by path.
#   * The root partition auto-grows to fill the disk.
#   * The OEM partition mounts at /oem.

passwd:
  users:
    - name: core
      groups:
        - sudo
        - docker

storage:
  directories:
    - path: /opt/arcio
      mode: 0755
    - path: /opt/bin
      mode: 0755
    - path: /etc/extensions
      mode: 0755
    - path: /var/lib/arcio
      mode: 0700

  files:
    - path: /etc/hostname
      mode: 0644
      contents:
        inline: arcio

    # ── compose ─────────────────────────────────────────────────────────────
    #
    # Fetched at build time by build.sh and inlined here, rather than pulled at
    # first boot. An appliance that needs the internet to finish booting is not
    # an appliance, and an air-gapped one would never finish at all.
    - path: /opt/arcio/compose.yaml
      mode: 0644
      contents:
        local: build/compose.yaml

    - path: /opt/arcio/.env
      mode: 0600
      contents:
        inline: |
          # Pinned by the build. arcioctl update rewrites this line.
          #
          # `stable` is the released channel: the newest `v*` tag, taken
          # deliberately rather than as it lands. The appliance followed `edge`
          # through the beta, when there was no tagged release to follow.
          ARCIO_VERSION=stable
          TZ=UTC

    - path: /opt/bin/arcioctl
      mode: 0755
      contents:
        local: build/arcioctl

    # ── first boot ──────────────────────────────────────────────────────────
    - path: /opt/bin/arcio-firstboot
      mode: 0755
      contents:
        inline: |
          #!/usr/bin/env bash
          # Runs once. Generates what must not be baked into a shipped image,
          # then tells whoever is looking at the console what they need.
          set -euo pipefail

          STAMP=/var/lib/arcio/.firstboot
          # An explicit if, not `[ -f x ] && exit 0`. Under `set -e` that
          # idiom's behaviour depends on where it sits in the script, which is
          # not a thing to have to reason about at four in the morning.
          if [ -f "${STAMP}" ]; then
            exit 0
          fi

          # ── the compose plugin ────────────────────────────────────────────
          #
          # Flatcar ships Docker but not `docker compose`, and delivers Docker
          # itself as a systemd-sysext, so compose arrives the same way: an
          # immutable squashfs merged into /usr at boot, surviving OS updates
          # and leaving /usr read-only.
          #
          # The shipped appliance has this baked into the image and this block
          # does nothing. It exists for the development path, where the config
          # is handed to the hypervisor rather than baked, because the sysext
          # cannot travel inside the Ignition config.
          #
          # It was tried. Inlining the 14 MB squashfs as base64 produced a
          # 14.7 MB config.ign, and fw_cfg delivery of that hung
          # ignition-fetch-offline indefinitely: four minutes in, no progress,
          # no timeout. Ignition carries configuration. Payload goes in the
          # image.
          COMPOSE_SYSEXT_VERSION=5.5.1
          if [ ! -f /etc/extensions/docker-compose.raw ] && [ -f /oem/docker-compose.raw ]; then
            # The shipped appliance: bake.sh put it on the OEM partition,
            # which is the partition that exists to be customised. One fewer
            # network dependency at first boot, though not zero: compose still
            # pulls the application images. See bake.sh.
            install -m 0644 /oem/docker-compose.raw /etc/extensions/docker-compose.raw
            systemd-sysext refresh
          fi
          if [ ! -f /etc/extensions/docker-compose.raw ]; then
            base="https://github.com/flatcar/sysext-bakery/releases/download/docker-compose-${COMPOSE_SYSEXT_VERSION}"
            tmp="$(mktemp -d)"
            if curl -fsSL -o "${tmp}/x.raw" "${base}/docker-compose-${COMPOSE_SYSEXT_VERSION}-x86-64.raw" \
               && curl -fsSL -o "${tmp}/SHA256SUMS" "${base}/SHA256SUMS"; then
              want="$(grep "docker-compose-${COMPOSE_SYSEXT_VERSION}-x86-64.raw" "${tmp}/SHA256SUMS" | awk '{print $1}')"
              got="$(sha256sum "${tmp}/x.raw" | awk '{print $1}')"
              # Verified before it is installed. This blob is merged into /usr
              # on every boot, so it is as privileged as anything on the box.
              if [ -n "${want}" ] && [ "${want}" = "${got}" ]; then
                install -m 0644 "${tmp}/x.raw" /etc/extensions/docker-compose.raw
                systemd-sysext refresh
              else
                echo "compose sysext checksum mismatch, not installing" >&2
              fi
            fi
            rm -rf "${tmp}"
          fi

          # A password for the console account. Not baked in, because every
          # appliance would then ship with the same one, and it is extractable
          # by anyone who runs `qemu-img` over the file.
          #
          # `cut`, not a second `head`. `... | tr ... | head -c 20` makes head
          # close the pipe early, tr dies of SIGPIPE with status 141, and
          # pipefail turns that into a failed unit. cut reads to EOF, so tr
          # finishes on its own terms.
          #
          # The alphabet omits I, L, O, U, 0 and 1 for the same reason the
          # support reference does: somebody reads this down a phone line.
          PASS="$(head -c 512 /dev/urandom | tr -dc 'A-HJ-NP-Za-km-z2-9' | cut -c1-20)"
          echo "core:${PASS}" | chpasswd
          printf '%s\n' "${PASS}" > /var/lib/arcio/console-password
          chmod 600 /var/lib/arcio/console-password

          # BASE_URL has to be a real address or every link in an email Arcio
          # sends points at a machine the recipient does not have.
          #
          # An empty IP is a real case, not a defensive flourish: an appliance
          # booted where there is no DHCP server comes up with no global
          # address, and the naive version of this wrote
          # `ARCIO_BASE_URL=http://:3001` into the config and carried on. Better
          # to leave it unset, let compose fall back to localhost, and say so on
          # the console than to bake a malformed URL nobody looks at again.
          IP="$(ip -4 -o addr show scope global | awk '{print $4}' | cut -d/ -f1 | head -1 || true)"
          if [ -n "${IP}" ] && ! grep -q '^ARCIO_BASE_URL=' /opt/arcio/.env; then
            printf 'ARCIO_BASE_URL=http://%s:3001\n' "${IP}" >> /opt/arcio/.env
          fi

          touch "${STAMP}"

          # An appliance that did not get an address should say so on the
          # console rather than print a broken URL at somebody.
          if [ -n "${IP}" ]; then
            WEB="http://${IP}:3001"
          else
            WEB="no address. This appliance got none from DHCP; set one and reboot"
          fi

          # /etc/issue puts this on the console login screen, which is where
          # somebody who has just imported an OVA is actually looking.
          cat > /etc/issue <<EOF

            Arcio appliance

            Web        ${WEB}
            Console    core / ${PASS}

            Open the web address to finish setting Arcio up. You choose the
            administrator account there; nothing has to be read out of a log.

            After the first 30 minutes it asks for a setup code, so that an
            appliance left running cannot be claimed by a passer-by:
              sudo /opt/bin/arcioctl status

            Write the console password down. It is shown here and stored at
            /var/lib/arcio/console-password, and nowhere else.

          EOF

    # ── the OS updater ──────────────────────────────────────────────────────
    #
    # Off, deliberately, and this is a decision rather than an oversight.
    #
    # Stock Flatcar schedules an update check about two minutes after boot
    # against public.update.flatcar-linux.net and lets locksmithd reboot to
    # apply it. On an appliance that means two things nobody asked for: an
    # outbound connection that is not on the published egress list at
    # https://arcio.au/docs/network/, and an unannounced reboot of the
    # architecture repository.
    #
    # Air-gapped mode cannot stop either. It is an application-level control
    # and update_engine is a host process, so the switch that customers are
    # told stops all outbound traffic would not have reached it.
    #
    # So the appliance ships with OS updates off and takes them through
    # arcioctl, alongside application updates, where they are visible and
    # scheduled. Turning them back on is one file and is documented.
    #
    # overwrite is required: Flatcar ships this file, and Ignition refuses to
    # replace an existing path unless told to. Without it the whole config
    # fails and the machine reboot-loops into an emergency shell, which is how
    # this line came to be here.
    #
    # GROUP is preserved rather than cleared. Masking the units is what
    # actually stops updates; this file decides what would happen if somebody
    # unmasked them, and the answer should be "LTS, and do not reboot on your
    # own" rather than whatever the default was.
    - path: /etc/flatcar/update.conf
      mode: 0644
      overwrite: true
      contents:
        inline: |
          GROUP=lts
          REBOOT_STRATEGY=off

systemd:
  units:
    # Flatcar's own updater and reboot manager. Masked rather than disabled:
    # disabled units can still be started by a dependency, and the point is
    # that nothing reboots this box without an administrator.
    - name: update-engine.service
      mask: true
    - name: locksmithd.service
      mask: true

    - name: arcio-firstboot.service
      enabled: true
      contents: |
        [Unit]
        Description=Arcio first boot
        After=network-online.target
        Wants=network-online.target
        ConditionPathExists=!/var/lib/arcio/.firstboot
        Before=arcio.service

        [Service]
        Type=oneshot
        RemainAfterExit=yes
        ExecStart=/opt/bin/arcio-firstboot

        [Install]
        WantedBy=multi-user.target

    # ── the offline image bundle ────────────────────────────────────────────
    #
    # Its own unit rather than part of arcio-firstboot, and the ordering is the
    # reason. firstboot installs the compose sysext, which re-merges /usr, and
    # Docker is itself delivered as a sysext living in /usr. Making firstboot
    # depend on a running dockerd would mean remerging /usr underneath the
    # daemon that is running from it.
    #
    # So: firstboot does the things that need no daemon, this runs after Docker
    # is up, and arcio.service waits for both.
    - name: arcio-load-images.service
      enabled: true
      contents: |
        [Unit]
        Description=Load the offline image bundle
        After=docker.service arcio-firstboot.service
        Requires=docker.service
        Before=arcio.service
        ConditionPathExists=/opt/arcio/images.tar.gz

        [Service]
        Type=oneshot
        RemainAfterExit=yes
        # Unpacking a gigabyte is not a 90-second job on a slow disk.
        TimeoutStartSec=0
        ExecStart=/usr/bin/docker load -i /opt/arcio/images.tar.gz
        # Deleted on success only. 400MB of duplicate that is already unpacked
        # into Docker's storage, and keeping it costs a customer disk for the
        # life of the install to no purpose.
        ExecStartPost=/usr/bin/rm -f /opt/arcio/images.tar.gz
        # A corrupt bundle should degrade to pulling, not stop the appliance
        # booting. If there is no registry either, compose reports that, which
        # is the more useful error.
        SuccessExitStatus=0 1

        [Install]
        WantedBy=multi-user.target

    - name: arcio.service
      enabled: true
      contents: |
        [Unit]
        Description=Arcio
        After=docker.service arcio-firstboot.service arcio-load-images.service
        Requires=docker.service
        Wants=arcio-firstboot.service arcio-load-images.service

        [Service]
        Type=oneshot
        RemainAfterExit=yes
        WorkingDirectory=/opt/arcio
        # No TimeoutStartSec default: the first start pulls images, applies
        # migrations and seeds, which on a slow link is minutes rather than the
        # 90 seconds systemd would otherwise allow before calling it failed.
        TimeoutStartSec=0
        ExecStart=/usr/bin/docker compose up -d --remove-orphans
        ExecStop=/usr/bin/docker compose down

        [Install]
        WantedBy=multi-user.target

    # Backups are the one thing an appliance must not leave to somebody
    # remembering. See https://arcio.au/docs/backup-restore/ for why the
    # database alone is not a backup.
    - name: arcio-backup.service
      contents: |
        [Unit]
        Description=Arcio backup
        After=arcio.service
        Requires=arcio.service

        [Service]
        Type=oneshot
        ExecStart=/opt/bin/arcioctl backup

    - name: arcio-backup.timer
      enabled: true
      contents: |
        [Unit]
        Description=Nightly Arcio backup

        [Timer]
        OnCalendar=*-*-* 02:30:00
        Persistent=true

        [Install]
        WantedBy=timers.target
